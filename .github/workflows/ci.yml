name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    name: Build & package (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Юнит-тесты (Mockito) запускаются; контекстный ApplicationTests, требующий
      # PostgreSQL/Elasticsearch, исключён через maven-surefire-plugin в pom.xml.
      - name: Build & test with Maven
        run: mvn -B clean verify
