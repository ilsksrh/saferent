name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    name: Build & package (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Тесты пропускаются: единственный текущий тест поднимает полный
      # Spring-контекст и требует PostgreSQL/Elasticsearch. После добавления
      # юнит-тестов на Mockito (без внешних зависимостей) заменить на `mvn -B verify`.
      - name: Build with Maven
        run: mvn -B clean package -DskipTests
